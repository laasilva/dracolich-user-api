spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: dracolich-user-api
  webflux:
    base-path: dracolich/user/api/v0/
  mongodb:
    database: ${MONGODB_DATABASE}
    uri: ${MONGODB_URI}
    representation:
      uuid: standard
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8080}

jwt:
  private-key: ${DRACOLICH_JWT_PRIVATE_KEY:classpath:keys/ec-private.pem}
  public-key: ${DRACOLICH_JWT_PUBLIC_KEY:classpath:keys/ec-public.pem}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:900}
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800}
  confirmation-token-expiration: ${JWT_CONFIRMATION_EXPIRATION:86400}

app:
  confirmation-url: ${CONFIRMATION_URL:https://dev.dracolich.app/dracolich/user/api/v0/auth/confirm}
  from-address: ${MAIL_FROM:no-reply@dracolich.app}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

management:
  server:
    port: 7980
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
